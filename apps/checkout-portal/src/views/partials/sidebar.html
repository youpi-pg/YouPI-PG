    <!-- PC LEFT SIDEBAR (Razorpay 2-Column Exact Layout for Desktop) -->
    <aside class="ypg-pc-sidebar">
      <div>
        <!-- Merchant Brand Header -->
        <div class="ypg-pc-brand-header">
          <div class="ypg-pc-avatar" id="pcMerchantAvatarBox">
            <span id="pcMerchantAvatarLetter">M</span>
            <img id="pcMerchantAvatarImg" alt="Logo" style="display:none;" />
          </div>
          <div class="ypg-pc-brand-info">
            <div class="ypg-pc-merchant-name" id="pcMerchantName">{{MERCHANT_NAME}}</div>
            <div class="ypg-pc-trust-badge" id="pcTrustBadge">
              <svg class="ypg-pc-green-shield" viewBox="0 0 24 24" fill="none">
                <path d="M12 2L3 6v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V6l-9-4z" fill="#10b981" />
                <path d="M8.5 12l2.5 2.5 5-5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
              <span id="pcTrustBadgeText">{{TRUST_BADGE_TEXT}}</span>
            </div>
          </div>
        </div>

        <!-- Social Proof Banner -->
        <div class="ypg-pc-social-proof" id="pcSocialProofWrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1" />
            <circle cx="20" cy="21" r="1" />
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
          </svg>
          <span id="pcSocialProofText">500+ orders last month from {{MERCHANT_NAME}}</span>
        </div>

        <!-- Price Summary Card (STRICTLY NO UPI ID VISIBLE) -->
        <div class="ypg-pc-price-card">
          <div class="ypg-pc-price-label">Price Summary</div>
          <div class="ypg-pc-price-val" id="pcPriceSummaryAmount">₹{{AMOUNT}}</div>
        </div>

        <!-- User Identity Row -->
        <div class="ypg-pc-row-btn" id="pcCustomerProfileRow" onclick="toggleAccountMenu(event)">
          <div class="ypg-pc-row-left">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <span id="pcCustomerProfileText">Using as Guest User</span>
          </div>
          <span class="ypg-pc-chevron">&rsaquo;</span>
        </div>
      </div>

      <!-- Bottom Isometric Shopping Bags Graphic -->
      <div style="margin-top:auto;">
        <div class="ypg-pc-bags-wrap">
          <svg viewBox="0 0 260 160" width="220" height="135" fill="none">
            <ellipse cx="130" cy="145" rx="100" ry="12" fill="rgba(0,0,0,0.18)" />
            <!-- White / Cyan shopping bag with blue handles -->
            <path d="M100 65 L135 60 L145 135 L90 140 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
            <path d="M100 65 L135 60 L140 85 L95 90 Z" fill="#f1f5f9" />
            <path d="M110 63 C110 48, 125 48, 125 61" stroke="#0284c7" stroke-width="3" fill="none"
              stroke-linecap="round" />
            <!-- Green shopping bag with % badge -->
            <path d="M140 75 L180 70 L195 135 L135 140 Z" fill="#10b981" stroke="#059669" stroke-width="1.5" />
            <path d="M150 73 C150 58, 168 58, 168 71" stroke="#047857" stroke-width="3" fill="none"
              stroke-linecap="round" />
            <circle cx="160" cy="98" r="14" fill="#34d399" />
            <text x="160" y="103" font-size="12" font-weight="900" fill="#064e3b" text-anchor="middle">%</text>
            <!-- Blue gift box with white ribbon -->
            <path d="M55 100 L95 95 L105 140 L50 142 Z" fill="#0284c7" />
            <path d="M50 100 L95 95 L95 105 L48 108 Z" fill="#38bdf8" />
            <rect x="71" y="96" width="7" height="45" fill="#ffffff" />
          </svg>
        </div>
      </div>
    </aside>
